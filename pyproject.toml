[project]
name = "refusal-loc"
version = "0.1.0"
description = "RefusalLoc — 거부 정렬의 국소성: SFT→DPO 학습 동역학 + refusal direction 메커니즘 분석 (Qwen3-1.7B, 단일 RTX 5080)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.5",
    "datasketch>=1.10.0",
    "huggingface-hub>=1.17.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "protobuf>=7.35.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "statsmodels>=0.14.6",
    "tiktoken>=0.13.0",
    "torch>=2.11.0",
    "transformers>=5.9.0",
    "trl>=0.24.0",
    "wandb>=0.28.2",
]

# torch만 PyTorch cu128 인덱스(sm_120/Blackwell)에서, 나머지는 PyPI에서 받는다
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
